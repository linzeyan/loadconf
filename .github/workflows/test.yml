name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The lowest Go version the modules declare; local development covers
      # newer ones.
      - uses: actions/setup-go@v7
        with:
          go-version-file: config/go.mod
          cache-dependency-path: "**/go.sum"
      - run: make go.work
      - run: go vet github.com/linzeyan/loadconf/...
      - run: make test
